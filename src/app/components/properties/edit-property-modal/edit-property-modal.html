@if (open && property) {
  <div class="epm-overlay" >
    <div class="epm-box" (click)="$event.stopPropagation()" dir="rtl">

      <h3 class="epm-title">تعديل, <span class="epm-title-bold">العقار</span></h3>

      <form class="epm-form" (ngSubmit)="onSave()" [formGroup]="editForm">
        <div class="epm-row">
          <div class="epm-field">
            <label class="epm-label">اسم العقار</label>
            <input class="epm-input" type="text" name="name" formControlName="name" required />
          </div>
        </div>

        <div class="epm-row epm-row-2">
          <div class="epm-field">
            <label class="epm-label">نوع العقار</label>
            <select class="epm-input" formControlName="type" required>
              @for (t of propertyTypes; track t) {
                <option [value]="t">{{ t }}</option>
              }
            </select>
          </div>
          <div class="epm-field">
            <label class="epm-label">نوع التعاقد</label>
            <select class="epm-input" formControlName="contract_type">
              @for (c of propertycontractType; track c) {
                <option [value]="c">{{ c }}</option>
              }
            </select>
          </div>

          <div class="epm-field">
            <label class="epm-label">حالة العقار</label>
            <select class="epm-input" formControlName="status" required>
              @for (s of propertyStatuses; track s) {
                <option [value]="s">{{ s }}</option>
              }
            </select>
          </div>
        </div>

        <div class="epm-row epm-row-2">
          <div class="epm-field">
            <label class="epm-label">السعر</label>
            <input class="epm-input" type="number" formControlName="price" required />
          </div>

          <div class="epm-field">
            <label class="epm-label">العنوان</label>
            <input class="epm-input" type="text" formControlName="location" />
          </div>
        </div>

        <div class="epm-row">
          <div class="epm-field">
            <label class="epm-label">الصورة</label>
            <input class="epm-input" type="text"  name="image" />
          </div>
        </div>

        <div class="epm-row">
          <div class="epm-field">
            <label class="epm-label">الوصف</label>
            <textarea class="epm-input epm-textarea" formControlName="description" rows="4"></textarea>
          </div>
        </div>
        <div class="epm-row">
          <div class="epm-field">
            <label class="epm-label">المزايا</label>
            @for (i of property.features; track i) {
              <div class="epm-feature">
                <input type="checkbox" [value]="i" [checked]="i" />
                <span>{{ i }}</span>
              </div>
            }
          </div>
        </div>

        @if (saveError) {
          <p role="alert">{{ saveError }}</p>
        }

        <div class="epm-actions">
          <button type="button" class="btn-epm-cancel" (click)="onCancel()" [disabled]="isSaving">إلغاء</button>
          <button type="submit" class="btn-epm-save" [disabled]="editForm.invalid || isSaving">
            {{ isSaving ? 'جاري الحفظ...' : 'حفظ' }}
          </button>
        </div>
      </form>

    </div>
  </div>
}

<div class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete Agent</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Are u sure u want to delete this agent?</p>
      </div>
      <div class="modal-footer">
        <button type="button" (click)="onCancel()" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" (click)="onDelete()" class="btn btn-primary">Delete</button>
      </div>
    </div>
  </div>
</div>
